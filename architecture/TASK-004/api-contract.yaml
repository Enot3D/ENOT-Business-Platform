openapi: 3.1.0
info:
  title: ENOT Business Platform MVP
  version: 0.1.0
  description: Проект контракта. Ошибки используют стабильные code/message/request_id. Курсоры непрозрачные и привязаны
    к фильтрам и владельцу для частных ресурсов. Запись с Idempotency-Key сравнивает канонический хеш запроса в
    рамках владельца и маршрута. Несовместимые изменения требуют нового major пути.
servers:
- url: /api/v1
security:
- SessionCookie: []
paths:
  /session:
    post:
      operationId: login
      description: Создать сессию и вернуть CSRF-токен; Set-Cookie с непрозрачной сессией.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
    get:
      operationId: getSession
      description: Прочитать текущую сессию и CSRF-токен.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    delete:
      operationId: logout
      description: Отозвать текущую сессию.
      responses:
        '204':
          description: Успешный ответ
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /datasets/current:
    get:
      operationId: getCurrentDataset
      description: Текущий опубликованный выпуск с допустимой географией и отраслями.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /niches:
    get:
      operationId: listNiches
      description: Каталог текущего либо заданного выпуска. Сортировка по точному lower и ID. Курсор фиксирует выпуск
        и фильтры. Регион требует country. География строго по покрытию, бюджет по start_min. При бюджете include_unknown_budget
        разрешает карточки без start_min.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NichePage'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: dataset_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: country
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: region
        in: query
        required: false
        schema:
          type: string
          maxLength: 32
      - name: industry
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: budget_rub
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000000000
      - name: include_unknown_budget
        in: query
        required: false
        schema:
          type: boolean
          default: false
  /niches/{niche_id}:
    get:
      operationId: getNiche
      description: Карточка и доказательства указанного или текущего выпуска.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicheDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: niche_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: dataset_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
  /niches/{niche_id}/scores:
    post:
      operationId: recalculateScore
      description: Повторно вычислить либо вернуть сохранённый результат по неизменяемым входам.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: niche_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recalculate'
  /scoring-models:
    get:
      operationId: listScoringModels
      description: История опубликованных версий методики; v1 только для справки.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /comparisons:
    post:
      operationId: compareNiches
      description: Сравнить 2–5 уникальных ниш одного выпуска, сохранив порядок запроса.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
  /sources:
    get:
      operationId: listSources
      description: Реестр версий источников выбранного выпуска, курсор фиксирует выпуск.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: dataset_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /sources/{source_version_id}:
    get:
      operationId: getSourceVersion
      description: Версия источника по ID, в том числе из исторического выпуска.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceVersion'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: source_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /research-projects:
    get:
      operationId: listProjects
      description: История проектов владельца; порядок updated_at и ID по убыванию.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: createProject
      description: Создать личное исследование с параметрами поиска.
      responses:
        '201':
          description: Успешный ответ
          headers:
            Location:
              schema:
                type: string
              description: Путь созданного ресурса или статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
  /research-projects/{project_id}:
    get:
      operationId: getProject
      description: Получить параметры личного проекта.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /research-projects/{project_id}/reports:
    get:
      operationId: listReports
      description: Версии отчётов проекта по убыванию номера.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: saveReport
      description: Сохранить неизменяемый снимок. interpretation_id может быть null; иначе интерпретация терминальная
        и соответствует набору.
      responses:
        '201':
          description: Успешный ответ
          headers:
            Location:
              schema:
                type: string
              description: Путь созданного ресурса или статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
  /research-projects/{project_id}/reports/{report_id}:
    get:
      operationId: getReport
      description: Прочитать исторический снимок отчёта владельца.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /research-projects/{project_id}/interpretations:
    post:
      operationId: requestInterpretation
      description: Поставить в очередь объяснение; status_url указывает на GET. Повтор с тем же ключом и телом возвращает
        тот же ресурс.
      responses:
        '202':
          description: Успешный ответ
          headers:
            Location:
              schema:
                type: string
              description: Путь созданного ресурса или статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interpretation'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Selection'
  /research-projects/{project_id}/interpretations/{interpretation_id}:
    get:
      operationId: getInterpretation
      description: Опрос статуса интерпретации владельца.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interpretation'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: interpretation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      name: enot_session
      in: cookie
  responses:
    Error401:
      description: Требуется вход или неверные учётные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Проверка Origin или CSRF не пройдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Ресурс недоступен в выбранном выпуске или владельцу
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Конфликт ключа идемпотентности либо несовместимая интерпретация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Недопустимые поля, курсор или комбинация фильтров
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Превышен лимит запросов или квота
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Зависимость временно недоступна
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      additionalProperties: false
    Login:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    Session:
      type: object
      required:
      - user_id
      - csrf_token
      - expires_at
      properties:
        user_id:
          type: string
          format: uuid
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    CatalogFilters:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
          pattern: ^[A-Z]{2}$
        region:
          type: string
          maxLength: 32
        industry:
          type: string
          maxLength: 64
        budget_rub:
          type: integer
          minimum: 0
          maximum: 1000000000000
        include_unknown_budget:
          type: boolean
          default: false
    Model:
      type: object
      required:
      - version
      - calculator_commit
      - calculator_sha256
      - criteria_order
      - weights
      - published_at
      properties:
        version:
          type: string
        calculator_commit:
          type: string
        calculator_sha256:
          type: string
        criteria_order:
          type: array
          items:
            type: string
        weights:
          type: array
          items:
            type: integer
            minimum: 0
        published_at:
          type: string
          format: date-time
      additionalProperties: false
    Score:
      type: object
      required:
      - id
      - model_version
      - lower
      - upper
      - coverage
      - confidence
      - rank_from
      - rank_to
      - calculated_at
      properties:
        id:
          type: string
          format: uuid
        model_version:
          type: string
        lower:
          type: number
          minimum: 0
          maximum: 100
        upper:
          type: number
          minimum: 0
          maximum: 100
        coverage:
          type: number
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 100
        rank_from:
          type: integer
          minimum: 1
        rank_to:
          type: integer
          minimum: 1
        calculated_at:
          type: string
          format: date-time
      additionalProperties: false
    Market:
      type: object
      required:
      - country
      - region
      - name
      properties:
        country:
          type: string
        region:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
      additionalProperties: false
    Dataset:
      type: object
      required:
      - id
      - version
      - published_at
      - markets
      - industries
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        published_at:
          type: string
          format: date-time
        markets:
          type: array
          items:
            $ref: '#/components/schemas/Market'
        industries:
          type: array
          items:
            type: string
      additionalProperties: false
    Niche:
      type: object
      required:
      - id
      - legacy_code
      - dataset_id
      - title
      - market
      - industry
      - segment
      - updated_at
      - score
      - start_min
      - start_max
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
